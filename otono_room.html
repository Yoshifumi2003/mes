<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>♪オトノルーム</title>
<style>
:root{
  --track-height:40px;
  --row-gap:10px;
  --sidebar-width:220px;
  --beat-width:50px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#fff;color:#000;}
header{background:#000;color:#fff;padding:10px 20px;font-size:18px;}
.developer{font-size:12px;color:#bbb;float:right;line-height:1.2;}
.controls{background:#e0e0e0;padding:10px 20px;white-space:nowrap;}
.controls button{margin-right:10px;padding:8px 12px;}
.controls select{margin-left:10px;padding:6px 8px;}
#trackWrapper{position:relative;width:100%;height:720px;display:flex;overflow:hidden;}
#trackSidebar{position:relative;width:var(--sidebar-width);background:#ddd;border-right:2px solid #999;z-index:11;
  background-image:repeating-linear-gradient(to bottom,#ddd 0px,#ddd 1px,transparent 1px calc(var(--track-height)+var(--row-gap)));
}
#trackArea{position:relative;flex:1;overflow-x:auto;overflow-y:hidden;background:#fff;}
#timelineOverlay{pointer-events:none;position:absolute;top:0;left:0;height:100%;z-index:55;}
#tracksContainer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;}
.track{position:absolute;height:var(--track-height);line-height:var(--track-height);border-radius:4px;color:#fff;font-weight:bold;cursor:move;padding-left:10px;touch-action:none;}
.track audio{display:none;}
.resize-handle{position:absolute;top:0;width:12px;height:100%;background:rgba(0,0,0,0.35);cursor:ew-resize;touch-action:none;z-index:5;pointer-events:auto;}
.resize-right{right:0;}
.resize-left{left:0;}
.trackSidebar{position:absolute;left:0;width:100%;height:var(--track-height);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:14px;border-bottom:1px solid #ccc;background:transparent;}
.trackSidebar input[type='range']{flex:1 1 auto;}
/* Hide built-in tiny buttons used by context menu wires */
.track button{position:absolute !important;width:0 !important;height:0 !important;padding:0 !important;margin:0 !important;border:none !important;opacity:0 !important;pointer-events:none !important;}
#trackContextMenu button{margin:2px 6px;}
ruby rt{font-size:.75em;color:#222;}
</style>
</head>
<body>
<header>♪<span id="titleText">オトノルーム</span>
  <span class="developer">MORITA Education System×道北音楽教育研究所<br/><span style='font-size: 10px; display:block; text-align:right;'>©2025 Yoshifumi Morita</span></span>
</header>
<div class="controls">
  <button id="recordBtn">録音開始</button>
  <button id="stopBtn">録音停止</button>
  <button id="fileAddBtn">ファイル追加</button>
  <button id="saveBtn">保存</button>
  <button id="openBtn">開く</button>
  <button id="playBtn">再生</button>
  <button id="pauseBtn">一時停止</button>
  <span id="recTime">録音時間: 0秒</span>&nbsp;&nbsp;&nbsp;拍子:
  <select id="meterSelect"><option value="3">3拍子</option><option selected value="4">4拍子</option></select>&nbsp;&nbsp;&nbsp;テンポ:
  <input id="tempoSlider" max="240" min="30" step="1" type="range" value="60"/><span id="bpmDisplay">60</span> BPM
</div>
<div id="trackWrapper">
  <div id="trackSidebar"></div>
  <div id="trackArea">
    <div id="timelineOverlay"></div>
    <div id="tracksContainer"></div>
  </div>
</div>

<input accept="audio/*" id="hiddenFileInput" multiple style="display:none" type="file"/>
<input accept=".soundroomproj,.json" id="hiddenProjectInput" style="display:none" type="file"/>

<script>
/* ================== Constants ================== */
const beatWidth = 50;
const trackHeight = 40;
const rowGap = 10;
const trackSpacing = trackHeight + rowGap;
const totalBeats = 160;
let meter = 4;

let mediaRecorder=null,chunks=[],trackIndex=0,currentTrackEl=null,currentAudioEl=null,timer=null;
const trackColors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];

/* ================== Elements ================== */
const recordBtn=document.getElementById('recordBtn');
const stopBtn=document.getElementById('stopBtn'); stopBtn.disabled = true;
const playBtn=document.getElementById('playBtn');
const pauseBtn=document.getElementById('pauseBtn');
const fileAddBtn=document.getElementById('fileAddBtn');
const hiddenFile=document.getElementById('hiddenFileInput');
const saveBtn=document.getElementById('saveBtn');
const openBtn=document.getElementById('openBtn');
const meterSel=document.getElementById('meterSelect');
const tempoSlider=document.getElementById('tempoSlider');
const bpmDisplay=document.getElementById('bpmDisplay');
const recTimeLabel=document.getElementById('recTime');

/* ================== Tempo & Timeline ================== */
let bpm=parseInt(tempoSlider.value);
let playbackRate=bpm/60;
tempoSlider.addEventListener('input',()=>{bpm=parseInt(tempoSlider.value);bpmDisplay.textContent=bpm;playbackRate=bpm/60;});

function createTimeline(beats=totalBeats){
  const ov=document.getElementById('timelineOverlay');
  ov.innerHTML='';
  ov.style.width=(beats*beatWidth)+'px';
  for(let i=0;i<beats;i++){
    const x=i*beatWidth;
    const v=document.createElement('div');
    const isMeasureStart = (i % meter) === 0;
    const lineWidth = isMeasureStart ? 2 : 1;
    const lineOpacity = isMeasureStart ? 0.6 : 0.35;
    v.style.cssText=`position:absolute;top:0;bottom:0;left:${x}px;width:${lineWidth}px;background:rgba(0,0,0,${lineOpacity});`;
    ov.appendChild(v);
    const lbl=document.createElement('div');
    lbl.style.cssText=`position:absolute;top:0;left:${x}px;width:${beatWidth}px;height:${rowGap}px;line-height:${rowGap}px;text-align:center;font-size:12px;background:rgba(255,255,255,0.9);`;
    lbl.textContent=(i%meter)+1;
    ov.appendChild(lbl);
  }
}
createTimeline();
meterSel.addEventListener('change',e=>{meter=parseInt(e.target.value);createTimeline();});

/* ================== Sidebar Row ================== */
function addSidebarRow(index,audio){
  const sidebar=document.getElementById('trackSidebar');
  const row=document.createElement('div');
  row.className='trackSidebar';
  row.dataset.row = index;
  row.style.top=(rowGap+index*trackSpacing)+'px';

  const label=document.createElement('div');
  label.textContent=`Track ${index+1}`;
  label.contentEditable = "true";
  label.style.minWidth = "60px";
  label.style.outline = "none";
  row.appendChild(label);

  const slider=document.createElement('input');
  slider.type='range';
  slider.min=0; slider.max=1; slider.step=0.01; slider.value=1;
  slider.oninput=()=>{document.querySelectorAll(`.track[data-row="${index}"] audio`).forEach(el=>el.volume=parseFloat(slider.value));};
  row.appendChild(slider);
  sidebar.appendChild(row);
}


/* ================== Row compaction (no blank rows) ================== */
function nextRowIndex(){
  // Number of existing visible rows (sidebar rows are the single source of truth)
  return document.querySelectorAll('#trackSidebar .trackSidebar').length;
}

function compactTracks(){
  // Build ordered list of existing rows (prefer sidebar order; fallback to track dataset rows)
  const sidebarRows = Array.from(document.querySelectorAll('#trackSidebar .trackSidebar'));
  let orderedOldRows = sidebarRows
    .map(r => parseInt(r.dataset.row))
    .filter(n => !isNaN(n));

  if(orderedOldRows.length === 0){
    const trackRows = Array.from(document.querySelectorAll('.track'))
      .map(t => parseInt(t.dataset.row))
      .filter(n => !isNaN(n));
    orderedOldRows = [...new Set(trackRows)].sort((a,b)=>a-b);
  }

  // Map old row index -> new compact index (0..)
  const map = new Map();
  orderedOldRows.forEach((oldRow, newRow)=>map.set(oldRow, newRow));

  // Reposition sidebar rows + renumber labels if they are still default "Track N"
  const defaultLabelRe = /^Track\s+\d+$/;
  Array.from(document.querySelectorAll('#trackSidebar .trackSidebar')).forEach(sb=>{
    const oldRow = parseInt(sb.dataset.row);
    const newRow = map.has(oldRow) ? map.get(oldRow) : null;
    if(newRow === null) return;
    sb.dataset.row = String(newRow);
    sb.style.top = (rowGap + newRow * trackSpacing) + 'px';

    const label = sb.querySelector('div');
    if(label && defaultLabelRe.test(label.textContent.trim())){
      label.textContent = `Track ${newRow+1}`;
    }
  });

  // Reposition tracks (all clips) belonging to each row
  Array.from(document.querySelectorAll('.track')).forEach(tr=>{
    const oldRow = parseInt(tr.dataset.row);
    const newRow = map.has(oldRow) ? map.get(oldRow) : null;
    if(newRow === null) return;
    tr.dataset.row = String(newRow);
    tr.style.top = (rowGap + newRow * trackSpacing) + 'px';
  });

  // Ensure future "new row" index is correct
  trackIndex = nextRowIndex();
}



/* ================== GLOBAL pointer resize state (Edge-safe) ================== */
let r_active=false;
let r_side=null; // 'left' | 'right'
let r_track=null;
let r_pid=null;  // pointerId
let r_startX=0;
let r_baseLeft=0;
let r_baseWidth=0;
let r_baseTrim=0;

function pxInt(v, fallback=0){ const n=parseInt(v); return isNaN(n)?fallback:n; }
function pxFloat(v, fallback=0){ const n=parseFloat(v); return isNaN(n)?fallback:n; }

function beginResize(track, side, e, handle){
  r_active=true; r_side=side; r_track=track; r_pid=e.pointerId;
  r_startX=e.clientX;
  r_baseLeft=pxInt(track.style.left, track.offsetLeft);
  r_baseWidth=pxFloat(track.style.width, track.getBoundingClientRect().width);
  r_baseTrim=pxFloat(track.dataset.trimStartSec||'0', 0);
  try{ handle.setPointerCapture(r_pid);}catch{}
  document.body.style.cursor='ew-resize';
}
function doResize(e){
  if(!r_active || e.pointerId!==r_pid || !r_track) return;
  const dx = e.clientX - r_startX;
  const minW = beatWidth;
  if(r_side==='left'){
    // propose values
    let newWidth = r_baseWidth - dx;
    if(newWidth < minW){ newWidth = minW; }
    // clamp dx to effective amount applied
    const effDx = r_baseWidth - newWidth;
    const newLeft = r_baseLeft + effDx;
    r_track.style.width = newWidth + 'px';
    r_track.style.left  = newLeft  + 'px';
    const secPerBeat=60/bpm;
    r_track.dataset.trimStartSec = Math.max(0, r_baseTrim + (effDx/beatWidth)*secPerBeat);
  }else if(r_side==='right'){
    let newWidth = r_baseWidth + dx;
    if(newWidth < minW){ newWidth = minW; }
    r_track.style.width = newWidth + 'px';
  }
  e.preventDefault();
}
function endResize(e, handle){
  if(e.pointerId!==r_pid) return;
  try{ handle && handle.releasePointerCapture(r_pid);}catch{}
  r_active=false; r_side=null; r_track=null; r_pid=null;
  document.body.style.cursor='default';
}

/* ================== Track Enhancements ================== */
function enhanceTrack(track,audio){
  // handles
  const rh=document.createElement('div'); rh.className='resize-handle resize-right'; track.appendChild(rh);
  const lh=document.createElement('div'); lh.className='resize-handle resize-left';  track.appendChild(lh);

  // attach start/end only to handles; pointermove is window-level (Edgeでのイベント伝播差異対策)
  lh.addEventListener('pointerdown', e=>{ e.stopPropagation(); beginResize(track,'left', e, lh); });
  rh.addEventListener('pointerdown', e=>{ e.stopPropagation(); beginResize(track,'right',e, rh); });
  window.addEventListener('pointermove', doResize, {passive:false});
  const endL = e=> endResize(e, lh);
  const endR = e=> endResize(e, rh);
  window.addEventListener('pointerup', endL);
  window.addEventListener('pointercancel', endL);
  window.addEventListener('pointerup', endR);
  window.addEventListener('pointercancel', endR);

  // Drag (disabled while resizing)
  (function(){
    let d_pid=null, d_startX=0, baseLeft=0;
    track.addEventListener('pointerdown', e=>{
      if(e.target.closest('.resize-handle')) return;
      if(r_active) return;
      d_pid=e.pointerId; d_startX=e.clientX; baseLeft=pxInt(track.style.left, track.offsetLeft);
      track.setPointerCapture(d_pid);
      document.body.style.cursor='grabbing';
      e.preventDefault();
    });
    function d_move(e){
      if(d_pid===null || e.pointerId!==d_pid) return;
      if(r_active) return;
      const dx=e.clientX-d_startX;
      track.style.left = (baseLeft + dx) + 'px';
      e.preventDefault();
    }
    function d_end(e){
      if(d_pid===null || e.pointerId!==d_pid) return;
      try{ track.releasePointerCapture(d_pid);}catch{}
      d_pid=null;
      document.body.style.cursor='default';
    }
    window.addEventListener('pointermove', d_move, {passive:false});
    window.addEventListener('pointerup', d_end);
    window.addEventListener('pointercancel', d_end);
  })();

  // Delete
  const del=document.createElement('button');
  del.textContent='×';
  del.style.cssText='position:absolute;right:10px;top:5px;';
  del.onclick=()=>{
    const removedRow = parseInt(track.dataset.row);
    track.remove();

    const remainingInRow = Array.from(document.querySelectorAll('.track'))
      .filter(t => parseInt(t.dataset.row) === removedRow);

    if(remainingInRow.length===0){
      const sb = document.querySelector(`#trackSidebar .trackSidebar[data-row="${removedRow}"]`);
      if(sb) sb.remove();
    }
    compactTracks();
  };
  track.appendChild(del);
  track._delBtn = del;

  // Duplicate
  const dup=document.createElement('button');
  dup.textContent='＋';
  dup.style.cssText='position:absolute;right:70px;top:5px;';
  dup.onclick=()=>{
    const clone = track.cloneNode(true);
    clone.removeAttribute('data-cm-patched');
    clone.dataset.row = track.dataset.row;
    clone.dataset.trimStartSec = track.dataset.trimStartSec || 0;
    const originalAudio = track.querySelector('audio');
    const newAudio = clone.querySelector('audio');
    newAudio.src = originalAudio.src;
    newAudio.volume = originalAudio.volume;
    const currentLeft = pxInt(track.style.left, track.offsetLeft);
    clone.style.left = (currentLeft + beatWidth) + 'px';
    document.getElementById('tracksContainer').appendChild(clone);
    enhanceTrack(clone, newAudio);
    if (window.patchTrack) window.patchTrack(clone);
  };
  track.appendChild(dup);
  track._dupBtn = dup;

  // Context menu (right-click) & long-press
  track.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    if(window._trackContextMenu && window._trackContextMenu.showMenu){
      window._trackContextMenu.showMenu(track, e.clientX, e.clientY);
    }
  });
  (function(){
    let lpTimer=null, startPoint=null;
    track.addEventListener('pointerdown', (e)=>{
      if(e.pointerType==='touch' || e.pointerType==='pen'){
        startPoint = {x:e.clientX, y:e.clientY};
        lpTimer = setTimeout(()=>{
          if(window._trackContextMenu && window._trackContextMenu.showMenu){
            window._trackContextMenu.showMenu(track, startPoint.x, startPoint.y);
          }
        }, 550);
      }
    }, {passive:true});
    function clearLP(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }
    track.addEventListener('pointerup', clearLP, {passive:true});
    track.addEventListener('pointercancel', clearLP, {passive:true});
    track.addEventListener('pointermove', clearLP, {passive:true});
  })();
}


/* ================== Recording (unchanged) ================== */
recordBtn.onclick = () => {
  recordBtn.disabled = true;
  stopBtn.disabled = true;
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}}).then(stream=>{
    stopBtn.disabled = false;
    mediaRecorder=new MediaRecorder(stream);
    chunks=[];
    mediaRecorder.ondataavailable=e=>chunks.push(e.data);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      currentAudioEl.src=URL.createObjectURL(blob);
      trackIndex = nextRowIndex();
      chunks=[];
    };
    mediaRecorder.start();

    // create track
    const rowIndex = nextRowIndex();
    const top=rowGap+rowIndex*trackSpacing;
    currentTrackEl=document.createElement('div');
    currentTrackEl.className='track';
    currentTrackEl.dataset.trimStartSec = 0;
    currentTrackEl.dataset.row=rowIndex;
    Object.assign(currentTrackEl.style,{left:'0px',top:top+'px',width:'1px',backgroundColor:trackColors[rowIndex%trackColors.length]});
    currentAudioEl=document.createElement('audio');
    currentTrackEl.appendChild(currentAudioEl);
    document.getElementById('tracksContainer').appendChild(currentTrackEl);
    addSidebarRow(rowIndex,currentAudioEl);
    trackIndex = nextRowIndex();

    // timer
    const startT=Date.now();
    timer=setInterval(()=>{
      const sec=Math.floor((Date.now()-startT)/1000);
      setRecTime(sec);
      currentTrackEl.style.width=(sec*beatWidth)+'px';
    },1000);

    enhanceTrack(currentTrackEl,currentAudioEl);
  }).catch(err=>{
    console.error(err);
    alert('マイクへのアクセスが許可されなかったため、録音を開始できませんでした。ブラウザの設定からマイクを許可してください。');
    recordBtn.disabled = false;
    stopBtn.disabled = true;
  });
};
stopBtn.onclick=()=>{
  if(mediaRecorder){
    mediaRecorder.stop();
    clearInterval(timer);
    setRecTime(0);
    recordBtn.disabled = false;
    stopBtn.disabled = true;
    mediaRecorder = null;
  }
};

/* ================== File Import ================== */
fileAddBtn.onclick=()=>hiddenFile.click();
hiddenFile.onchange=e=>{
  Array.from(e.target.files).forEach(file=>{
    const url=URL.createObjectURL(file);
    addTrackFromFile(url,file.name);
  });
  hiddenFile.value='';
  if(recordBtn) recordBtn.disabled = false;
  if(stopBtn) stopBtn.disabled = true;
  if(typeof recTimeLabel !== 'undefined') setRecTime(0);
};
function addTrackFromFile(url,label){
  const rowIndex = nextRowIndex();
  const top=rowGap+rowIndex*trackSpacing;
  const tr=document.createElement('div');
  tr.className='track';
  tr.dataset.trimStartSec = 0;
  tr.dataset.row = rowIndex;
  Object.assign(tr.style,{left:'0px',top:top+'px',width:'100px',backgroundColor:trackColors[rowIndex%trackColors.length]});
  const au=document.createElement('audio');au.src=url;tr.appendChild(au);
  document.getElementById('tracksContainer').appendChild(tr);
  addSidebarRow(rowIndex,au);
  trackIndex = nextRowIndex();
  enhanceTrack(tr,au);
  au.addEventListener('loadedmetadata',()=>{tr.style.width=(au.duration*beatWidth)+'px';});
}

/* ================== Playback ================== */
let playbackTimeouts=[];
function clearPlaybackTimeouts(){ playbackTimeouts.forEach(id=>clearTimeout(id)); playbackTimeouts=[]; }

function startPlayback(){
  clearPlaybackTimeouts();
  document.getElementById('playhead')?.remove();
  const ph=document.createElement('div');
  Object.assign(ph.style,{position:'absolute',top:0,width:'2px',height:'100%',background:'red',zIndex:100,left:'0px'});
  ph.id='playhead';
  document.getElementById('trackArea').appendChild(ph);

  let maxEnd=0;
  document.querySelectorAll('.track').forEach(tr=>{
    const au=tr.querySelector('audio');
    if(!au||!au.src)return;
    const leftBeats=pxInt(tr.style.left, tr.offsetLeft)/beatWidth;
    const durBeats=pxFloat(tr.style.width, tr.getBoundingClientRect().width)/beatWidth;
    const slider=document.querySelector(`.trackSidebar[data-row="${tr.dataset.row}"] input[type='range']`);
    if(slider) au.volume=parseFloat(slider.value);
    const trimSec = parseFloat(tr.dataset.trimStartSec || 0);
    au.currentTime = trimSec;
    au.playbackRate=playbackRate;
    const playId=setTimeout(()=>{
      au.play().catch(()=>{});
      const stopId=setTimeout(()=>au.pause(),(durBeats/playbackRate)*1000);
      playbackTimeouts.push(stopId);
    },(leftBeats/playbackRate)*1000);
    playbackTimeouts.push(playId);
    maxEnd=Math.max(maxEnd,leftBeats+durBeats);
  });
  ph.style.transition='none';void ph.offsetWidth;
  ph.style.transition=`left ${(maxEnd/playbackRate)}s linear`;
  ph.style.left=(maxEnd*beatWidth)+'px';
}
playBtn.onclick=startPlayback;
pauseBtn.onclick=()=>{
  document.querySelectorAll('.track audio').forEach(au=>{ if(!au.paused){au.pause();} });
  clearPlaybackTimeouts();
  const ph=document.getElementById('playhead');
  if(ph){
    const left=parseFloat(window.getComputedStyle(ph).left);
    ph.style.transition='none';
    ph.style.left=left+'px';
  }
};

/* ================== Save/Open ================== */
async function saveProject(){
  const tracksData=[];
  const tracks=document.querySelectorAll('.track');
  for(const tr of tracks){
    const au=tr.querySelector('audio');
    if(!au||!au.src) continue;
    const obj={
      label:'',
      top:pxInt(tr.style.top)||tr.offsetTop,
      left:pxInt(tr.style.left)||tr.offsetLeft,
      width:pxInt(tr.style.width)||tr.offsetWidth,
      color:tr.style.backgroundColor,
      volume:au.volume,
      trimStartSec: parseFloat(tr.dataset.trimStartSec || 0)
    };
    try{
      const blob=await fetch(au.src).then(r=>r.blob());
      obj.data=await new Promise(res=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(blob);});
    }catch(e){console.error(e);}
    tracksData.push(obj);
  }
  const project={version:13,meter,bpm,tracks:tracksData};
  const blob=new Blob([JSON.stringify(project)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='soundroom_'+Date.now()+'.soundroomproj';
  a.click();
  URL.revokeObjectURL(a.href);
}
function clearProject(){
  document.getElementById('tracksContainer').innerHTML='';
  document.getElementById('trackSidebar').innerHTML='';
  trackIndex = 0;
}
function loadProject(data){
  clearProject();
  meter=data.meter||4; bpm=data.bpm||60;
  meterSel.value=meter.toString(); createTimeline();
  tempoSlider.value=bpm.toString(); bpmDisplay.textContent=bpm.toString();
  playbackRate=bpm/60;
  if(!Array.isArray(data.tracks)) return;
  const uniqueTops=[...new Set(data.tracks.map(t=>t.top))].sort((a,b)=>a-b);
  const topToRow=new Map(uniqueTops.map((top,idx)=>[top,idx]));
  data.tracks.forEach(t=>{
    const tops = data.tracks.map(t => t.top);
    trackIndex = tops.length > 0 ? Math.floor(Math.max(...tops) / trackSpacing + 1) : 0;
    const tr=document.createElement('div');
    tr.className='track';
    tr.dataset.trimStartSec = t.trimStartSec || 0;
    Object.assign(tr.style,{
      left:t.left+'px',
      top:t.top+'px',
      width:t.width+'px',
      backgroundColor:t.color||trackColors[topToRow.get(t.top)%trackColors.length]
    });
    const au=document.createElement('audio');
    au.src=t.data; au.volume=t.volume!==undefined?t.volume:1;
    tr.appendChild(au);
    document.getElementById('tracksContainer').appendChild(tr);
    if(!document.querySelector(`.trackSidebar[data-row="${topToRow.get(t.top)}"]`)){
      addSidebarRow(topToRow.get(t.top),au);
      document.querySelectorAll('.trackSidebar').forEach(el=>{
        if(!el.dataset.row) el.dataset.row=topToRow.get(t.top);
      });
    }
    enhanceTrack(tr,au);
  })
  // Reflow rows to remove any gaps and keep Track numbers sequential
  compactTracks();
;
}
saveBtn.addEventListener('click',saveProject);
openBtn.addEventListener('click',async ()=>{
  if(window.showOpenFilePicker){
    try{
      const [fileHandle] = await window.showOpenFilePicker({
        types:[{description:'SoundRoom Project',accept:{'application/json':['.soundroomproj','.json']}}],
        excludeAcceptAllOption:false,
        multiple:false
      });
      const file=await fileHandle.getFile();
      const text=await file.text();
      const data=JSON.parse(text);
      loadProject(data);
      return;
    }catch(err){}
  }
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.soundroomproj,.json';
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change',e=>{
    const file=e.target.files[0];
    if(!file){ document.body.removeChild(inp); return; }
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        loadProject(data);
      }catch(err){
        alert('プロジェクトファイルの読み込みに失敗しました。');
      }
      document.body.removeChild(inp);
    };
    reader.readAsText(file);
  });
  inp.click();
});

/* ================== Context menu minimal ================== */
document.addEventListener('DOMContentLoaded', () => {
  const menu = document.createElement('div');
  menu.id = 'trackContextMenu';
  menu.style.cssText = 'position:fixed;display:none;background:#fff;border:1px solid #666;padding:4px;border-radius:4px;z-index:10000;';
  menu.innerHTML = '<button id="cmDup">複製</button><button id="cmDel">削除</button>';
  document.body.appendChild(menu);

  // expose globally so tracks can open it
  window._trackContextMenu = {};

  let currentTrack = null;
  function showMenu(track, x, y){
    currentTrack = track;
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  function hideMenu(){ menu.style.display = 'none'; currentTrack = null; }
  window._trackContextMenu.showMenu = showMenu;
  window._trackContextMenu.hideMenu = hideMenu;
  document.addEventListener('click', e => { if(!menu.contains(e.target)) hideMenu(); });
  document.getElementById('cmDup').addEventListener('click', () => { if(currentTrack && currentTrack._dupBtn) currentTrack._dupBtn.click(); hideMenu(); });
  document.getElementById('cmDel').addEventListener('click', () => { if(currentTrack && currentTrack._delBtn) currentTrack._delBtn.click(); hideMenu(); });
});


/* ================== Furigana (improved) ================== */
const FURIGANA_DICT = [
  ['録音開始','ろくおんかいし'],['録音停止','ろくおんていし'],['録音時間','ろくおんじかん'],
  ['一時停止','いちじていし'],['拍子','ひょうし'],['保存','ほぞん'],['開く','ひらく'],
  ['再生','さいせい'],['秒','びょう'],['追加','ついか'],['複製','ふくせい'],['削除','さくじょ']
];

function escapeRegExp(str){return str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function furiganaWrapAll(text){
  // Dictionary-based ruby only (to avoid double-wrapping)
  const dict=[...FURIGANA_DICT].sort((a,b)=>b[0].length-a[0].length);
  let out = text;
  for(const [word, kana] of dict){
    const re = new RegExp(escapeRegExp(word), 'g');
    out = out.replace(re, `<ruby><rb>${word}</rb><rt>${kana}</rt></ruby>`);
  }
  return out;
}

function applyFurigana(root){
  const EXCLUDE_TEXT = '道北音楽教育研究所';
  const SKIP = new Set(['SCRIPT','STYLE','RUBY','RT','RB','TEXTAREA','SELECT','OPTION']);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      const txt = node.nodeValue;
      const p = node.parentElement;
      if(!txt || !txt.trim()) return NodeFilter.FILTER_REJECT;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.closest('ruby')) return NodeFilter.FILTER_REJECT;
      if(SKIP.has(p.tagName)) return NodeFilter.FILTER_REJECT;
      if(txt.includes(EXCLUDE_TEXT)) return NodeFilter.FILTER_REJECT;
      if(/[\u4E00-\u9FFF]/.test(txt)) return NodeFilter.FILTER_ACCEPT;
      return NodeFilter.FILTER_REJECT;
    }
  });
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn=>{
    const span = document.createElement('span');
    span.innerHTML = furiganaWrapAll(tn.nodeValue);
    tn.parentNode.replaceChild(span, tn);
  });
}

// helper for dynamic "録音時間"
function setRecTime(sec){
  const text = `録音時間: ${sec}秒`;
  const html = furiganaWrapAll(text);
  recTimeLabel.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', ()=>{
  applyFurigana(document.body);
  // ensure initial label has furigana
  setRecTime(0);
});
